<!doctype html>
<html lang="en">
<head>
<title>Plotline Timnath</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Tell buyers and future business owners what you want on Main Street in Timnath, Colorado.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow civic column (phone-first), sticky town bar, cards only for buildings. */
:root{
  --bg:#F3F6F2; --surface:#FFFFFF; --ink:#18282A; --muted:#5A6B69; --line:#D6DFDA;
  --accent:#0D6B64; --accent-ink:#FFFFFF; --accent-soft:#DCEDE9;
  --sun:#D99A12; --sun-soft:#FBEFCF; --warn:#9A5B00; --bad:#B23A2E;
  --wall:#E9DCC6; --brick:#B86A4B; --trim:#2F4B4A; --glass:#BFD8DA; --ground:#C9D3C9;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Public Sans", "Helvetica Neue", Arial, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1817; --surface:#172322; --ink:#E3ECE9; --muted:#9AAEAA; --line:#2A3B39;
  --accent:#4CBFB3; --accent-ink:#06201D; --accent-soft:#1D3633;
  --sun:#F0B940; --sun-soft:#3A3018; --warn:#F0B940; --bad:#F08A7E;
  --wall:#3B3528; --brick:#8A4C36; --trim:#9FC4BF; --glass:#2C4A4D; --ground:#22302E; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1817; --surface:#172322; --ink:#E3ECE9; --muted:#9AAEAA; --line:#2A3B39;
  --accent:#4CBFB3; --accent-ink:#06201D; --accent-soft:#1D3633;
  --sun:#F0B940; --sun-soft:#3A3018; --warn:#F0B940; --bad:#F08A7E;
  --wall:#3B3528; --brick:#8A4C36; --trim:#9FC4BF; --glass:#2C4A4D; --ground:#22302E; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);line-height:1.12;text-wrap:balance;margin:0}
h1{font-size:clamp(2rem,7vw,2.8rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.45rem;font-weight:700}
h3{font-size:1.1rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.label{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .in{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:1.2rem;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:8px}
.brand svg{width:22px;height:22px}
.brand small{font-family:var(--body);font-weight:600;font-size:.8rem;color:var(--muted)}
.nav{display:flex;gap:4px;margin-left:auto}
.nav a{text-decoration:none;color:var(--muted);font-weight:600;font-size:.88rem;padding:6px 10px;border-radius:8px}
.nav a.on{color:var(--ink);background:var(--bg)}
.about-grid{display:grid;gap:14px;padding-top:24px}
.promise{background:var(--ink);color:var(--bg);border-radius:16px;padding:22px 18px;display:grid;gap:10px}
.promise .label{color:inherit;opacity:.75}
.promise-line{font-family:var(--display);font-weight:800;font-size:clamp(1.5rem,5.5vw,2rem);line-height:1.15;text-wrap:balance;letter-spacing:-.01em}
.promise p:last-child{opacity:.85;max-width:60ch}
.pull{font-family:var(--display);font-weight:700;font-size:1.2rem;line-height:1.3;border-left:4px solid var(--sun);padding-left:14px;max-width:46ch}
.cta-card{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;background:var(--accent-soft);border-radius:14px;padding:16px}
.cta-card > div{display:grid;gap:4px;min-width:0;flex:1 1 220px}
.tiers{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.tier{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:2px;align-content:start}
.tier b{font-family:var(--display);font-size:2rem;line-height:1.1}
.tier p{margin-top:6px}
select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
.check{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;font-size:.88rem;color:var(--muted)}
.check input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent)}
@media (min-width:640px){.about-grid{grid-template-columns:1fr 1fr}}
.side{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 16px;display:grid;gap:14px;align-content:start}
.side .btn{justify-self:start}
.points{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.points li{display:grid;gap:2px;padding-left:14px;border-left:3px solid var(--accent-soft)}
.points li b{font-weight:700}
.points li span{color:var(--muted);font-size:.95rem}
.fair{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.status{font-size:.78rem;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.status.local{background:var(--sun-soft);color:var(--warn)}

/* home */
.hero{padding-block:32px 8px;display:grid;gap:14px}
.hero p{max-width:60ch;font-size:1.05rem}
.pledge{display:flex;flex-wrap:wrap;gap:8px}
.pledge span{font-size:.82rem;font-weight:600;padding:5px 10px;border:1px solid var(--line);border-radius:99px;background:var(--surface)}
.section{padding-block:28px 0;display:grid;gap:14px}
.cards{display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:grid}
.card .art{background:linear-gradient(var(--accent-soft),var(--bg));border-bottom:1px solid var(--line)}
.card .art svg{display:block;width:100%;height:auto;max-height:150px}
.art.idea{position:relative;display:block;text-decoration:none;color:inherit}
.art.idea img{display:block;width:100%;height:auto;aspect-ratio:1200/670;max-width:100%;object-fit:cover;background:var(--accent-soft)}
.idea-chip{position:absolute;left:12px;bottom:12px;background:var(--surface);color:var(--ink);border-radius:10px;padding:6px 10px;font-family:var(--display);font-weight:700;font-size:1rem;line-height:1.15;display:grid;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.idea-chip small{font-family:var(--body);font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.card .body{padding:16px;display:grid;gap:10px}
.tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);background:var(--sun-soft);padding:3px 8px;border-radius:6px}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.88rem;color:var(--muted)}
.wish{display:flex;align-items:baseline;gap:8px;font-size:.95rem}
.wish b{font-family:var(--display);font-size:1.15rem}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{appearance:none;border:0;cursor:pointer;font:600 .95rem/1 var(--body);padding:12px 16px;border-radius:10px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.block{width:100%;padding:16px;font-size:1.05rem}
.steps{display:grid;gap:10px;counter-reset:s}
.steps li{list-style:none;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.steps li::before{counter-increment:s;content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:700;display:grid;place-items:center;font-size:.85rem}
.steps{padding:0;margin:0}
.note{border-left:3px solid var(--sun);background:var(--surface);padding:12px 14px;border-radius:0 10px 10px 0;font-size:.92rem}

/* survey */
.back{display:inline-block;padding-block:16px 0;font-weight:600;text-decoration:none}
.bhead{padding-block:12px 4px;display:grid;gap:8px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 16px;display:grid;gap:18px}
.q + .q{margin-top:14px}
.qhead{display:grid;gap:4px}
.qhead .step{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.field{display:grid;gap:8px}
.field > .lbl{font-weight:600}
.field > .lbl em{font-style:normal;font-weight:400;color:var(--muted);font-size:.88rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;cursor:pointer;font:500 .92rem/1.2 var(--body);color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:99px;padding:9px 13px;min-height:40px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale .chip{border-radius:10px;padding:10px 0;font-weight:700;font-size:1.05rem;font-family:var(--display)}
.scale-ends{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted)}
input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:90px;resize:vertical}
.concept{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:var(--sun-soft);border-radius:10px;padding:12px}
.concept .ico{font-family:var(--display);font-weight:800;font-size:1.6rem;width:44px;height:44px;border-radius:10px;background:var(--surface);display:grid;place-items:center;color:var(--warn)}
.map{height:340px;border-radius:14px;border:1px solid var(--line);overflow:hidden;background:var(--accent-soft);z-index:0}
@media (min-width:600px){.map{height:420px}}
.pin-wrap{background:none;border:0}
.pin{display:grid;place-items:center;width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--accent);border:2px solid var(--surface);box-shadow:0 2px 6px rgba(0,0,0,.35)}
.pin b{transform:rotate(45deg);color:var(--accent-ink);font-family:var(--display);font-size:15px}
.pin-sm{width:28px;height:28px;flex:none;border-width:2px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.pin-sm b{font-size:13px}
h1 .pin-sm{width:34px;height:34px}
h1 .pin-sm b{font-size:16px}
.pin-on-art{position:absolute;left:12px;top:12px;width:40px;height:40px}
.pin-on-art b{font-size:18px}
.lettered{display:flex;align-items:center;gap:10px}
.lettered > span:last-child{min-width:0}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.legend-item{appearance:none;cursor:pointer;display:flex;align-items:center;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--ink);font:inherit;min-width:0}
.legend-item > span:last-child{display:grid;min-width:0;font-size:.88rem;line-height:1.25}
.legend-item small{color:var(--muted);font-size:.78rem}
.map-label{background:none;border:0}
.map-label span{display:inline-block;transform:translateX(-50%);white-space:nowrap;font:600 12px var(--body);color:var(--accent);background:var(--surface);padding:2px 8px;border-radius:99px;border:1px solid var(--line)}
.pop{display:grid;gap:4px;font-family:var(--body)}
.pop strong{font-family:var(--display);font-size:15px}
.pop-idea{color:var(--accent);font-weight:700}
.pop-meta{font-size:12px;color:#555}
.pop-links{display:flex;gap:12px;margin-top:4px;font-weight:700}
.leaflet-container{font-family:var(--body)}
.tiles-dark{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9)}
.mock{margin:0;display:grid;gap:6px}
.mock img{display:block;width:100%;height:auto;aspect-ratio:1200/670;max-width:100%;border-radius:10px;border:1px solid var(--line);background:var(--accent-soft);object-fit:cover}
.mock figcaption{font-size:.78rem;color:var(--muted);font-style:italic}
.saved-profile{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:.92rem}
.error{color:var(--bad);font-weight:600}
.privacy{font-size:.85rem;color:var(--muted)}

/* results */
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{appearance:none;border:0;background:transparent;color:var(--ink);font:600 .85rem var(--body);padding:8px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.banner{background:var(--sun-soft);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:.9rem}
.banner b{color:var(--warn)}
.filters{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.presets{display:flex;flex-wrap:wrap;gap:8px}
.preset{appearance:none;cursor:pointer;font:600 .85rem var(--body);color:var(--accent);background:var(--accent-soft);border:0;border-radius:8px;padding:8px 10px;text-align:left}
.headline{font-family:var(--display);font-size:1.3rem;font-weight:700;line-height:1.25;text-wrap:balance}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kpi{background:var(--surface);padding:12px 10px;display:grid;gap:2px;min-width:0}
.kpi b{font-family:var(--display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.kpi span{font-size:.75rem;color:var(--muted);line-height:1.3}
@media (max-width:480px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}
.bars{display:grid;gap:8px}
.br{display:grid;grid-template-columns:minmax(0,9.5em) 1fr 3.2em;gap:10px;align-items:center;font-size:.9rem}
.br .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.br .track{height:12px;background:var(--bg);border-radius:6px;overflow:hidden}
.br .fill{height:100%;background:var(--accent);border-radius:6px}
.br.top .fill{background:var(--sun)}
.br .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.quote{border-left:3px solid var(--accent);padding:2px 0 2px 12px;display:grid;gap:4px}
.quote small{color:var(--muted);font-size:.78rem}
.warnbox{border:1.5px dashed var(--sun);border-radius:10px;padding:10px 14px;font-size:.9rem}
.empty{padding:24px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.f-wall{fill:var(--wall)} .f-brick{fill:var(--brick)} .f-trim{fill:var(--trim)} .f-glass{fill:var(--glass)} .f-ground{fill:var(--ground)} .f-sun{fill:var(--sun)} .f-sign{fill:var(--surface)} .f-text{fill:var(--ink);font:700 11px var(--body)}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .4s ease}}
@media (max-width:480px){.status{font-size:0;width:12px;height:12px;padding:0;border-radius:50%;background:var(--accent);flex:none}.status.local{background:var(--sun)}.nav a{padding:6px 7px;font-size:.84rem}.nav{gap:0}.brand small{display:none}.bar .in{gap:8px;flex-wrap:nowrap}}
.foot{border-top:1px solid var(--line);background:var(--surface);margin-top:24px}
.foot-in{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px calc(24px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;font-size:.85rem}
.foot nav{display:flex;flex-wrap:wrap;gap:6px 16px}
.foot a{color:var(--accent);font-weight:600;text-decoration:none}
.privacy a{color:var(--accent)}
.policy{display:grid;gap:12px;padding-top:20px;max-width:64ch}
.policy h2{margin-top:18px}
.policy h3{margin-top:6px}
.policy ul{margin:0;padding-left:1.2em;display:grid;gap:6px}
.policy .promise{margin-block:8px}
.area-grid{display:grid;gap:14px}
@media (min-width:640px){.area-grid{grid-template-columns:1fr 1fr}}
.area-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;align-content:start}
.area-head{text-decoration:none;color:inherit;display:grid;gap:4px}
.area-sites{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.area-sites a{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.area-sites a > span:last-child{display:grid;min-width:0;line-height:1.25;font-size:.92rem}
.area-sites small{color:var(--muted);font-size:.8rem}
.area-wrap{background:none;border:0}
.area-pin{display:inline-grid;white-space:nowrap;cursor:pointer;background:var(--ink);color:var(--bg);font:700 13px var(--display);padding:5px 10px;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.3);line-height:1.15;text-align:center}
.area-pin.pos-e{transform:translate(16px,-50%)}.area-pin.pos-w{transform:translate(calc(-100% - 16px),-50%)}.area-pin.pos-se{transform:translate(8px,8px)}.area-pin.pos-s{transform:translate(-50%,14px)}.area-pin.pos-n{transform:translate(-50%,calc(-100% - 14px))}
.area-pin small{font:600 10px var(--body);opacity:.8}
.art-sketch{background:var(--accent-soft);aspect-ratio:1200/670;display:grid;place-items:center;max-width:100%}
.art-sketch svg{width:80%;height:auto}
.releases{display:grid;gap:14px;padding-top:8px}
.release{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:8px}
.rel-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.rel-v{font-family:var(--display);font-weight:800;font-size:1.05rem}
.rel-current{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:6px}
.release h2{font-size:1.2rem}
.release ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.release li{display:grid;grid-template-columns:5.6em 1fr;gap:10px;align-items:start;font-size:.95rem}
.rel-tag{font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;text-align:center;padding:3px 0;border-radius:6px;margin-top:2px}
.rel-new{background:var(--accent-soft);color:var(--accent)}
.rel-improved{background:var(--sun-soft);color:var(--warn)}
.rel-fixed{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.foot-ver{color:var(--muted)!important;font-weight:500!important;font-size:.8rem}
dialog.share{border:1px solid var(--line);border-radius:16px;padding:0;max-width:min(520px,calc(100vw - 32px));width:100%;background:var(--surface);color:var(--ink)}
dialog.share::backdrop{background:rgba(10,20,20,.45)}
.share-in{padding:18px;display:grid;gap:14px}
.share-in h2{font-size:1.2rem}
.copyrow{display:flex;gap:8px}.copyrow input{min-width:0;flex:1}
.qrbox{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.qr{background:#fff;padding:8px;border-radius:8px;border:1px solid var(--line);line-height:0}
.qr img,.qr canvas{display:block;max-width:100%}
.qr-side{display:grid;gap:6px;flex:1 1 180px;min-width:0}
.flyer-tools{display:grid;gap:10px;padding-block:8px 16px}
.flyer{background:#fff;color:#18282A;border:1px solid var(--line);border-radius:14px;padding:28px 24px;display:grid;gap:16px;max-width:640px;margin:0 auto}
.flyer h1{font-size:clamp(1.8rem,6vw,2.6rem);color:#18282A}
.flyer .label{color:#5A6B69}
.flyer-art{border-radius:10px;overflow:hidden;border:1px solid #D6DFDA}
.flyer-art img{display:block;width:100%;height:auto}
.flyer-idea{font-size:1.1rem}
.flyer-qr{display:flex;flex-wrap:wrap;gap:18px;align-items:center;border-top:2px solid #18282A;padding-top:16px}
.flyer-qr > div:last-child{flex:1 1 200px;display:grid;gap:4px}
.flyer-cta{font-family:var(--display);font-weight:800;font-size:1.6rem}
.flyer-foot{font-size:.85rem;color:#5A6B69;border-top:1px solid #D6DFDA;padding-top:10px}
@media print{
  body{background:#fff!important}
  .bar,.foot,.no-print,.toast,body::before{display:none!important}
  .wrap{max-width:none;padding:0}
  .flyer{border:0;border-radius:0;padding:0;max-width:none}
  @page{size:letter;margin:0.5in}
}
.hp{position:absolute!important;left:-10000px!important;top:auto;width:1px;height:1px;overflow:hidden}
.rep-head{display:grid;gap:6px;padding-block:6px 4px;border-bottom:3px solid var(--ink);margin-bottom:8px}
.rep-sec{padding-block:14px 4px;display:grid;gap:10px;break-inside:avoid}
.rep-sec h2{font-size:1.15rem}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.tbl table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:520px}
.tbl caption{text-align:left;padding:8px 10px;font-size:.8rem;color:var(--muted)}
.tbl th,.tbl td{padding:8px 10px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
.tbl thead th{font-size:.75rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border-top:0}
.tbl td.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.small-n td,.tbl tr.small-n th{color:var(--muted)}
.quotes{margin:0;padding-left:1.1em;display:grid;gap:8px}
@media print{.rep-sec{padding-block:8px 2px}.tbl{border:0;overflow:visible}.tbl table{min-width:0}.kpis{break-inside:avoid}}
.stage-banner{background:#7A2E8E;color:#fff;font-size:.88rem;padding:10px max(16px,env(safe-area-inset-left,0px));text-align:center}
.stage-banner a{color:#fff;font-weight:700}
@media print{.stage-banner{display:none}}

function effDist(p,b){
  const c=(p.concepts||{})[b.id];
  if(c&&c.dist)return c.dist;

  return b.area==='oldtown'&&band?LEGACY_DIST[band]||null:null;

function matches(p,b,f){
  const pr=p.profile||{}, c=(p.concepts||{})[b.id], dd=effDist(p,b);
  if(f.who==='walk'&&dd!=='walk')return false;
  if(f.who==='near'&&dd!=='walk'&&dd!=='near')return false;
  if(['timnath','windsor','fortcollins'].includes(f.who)&&pr.town!==f.who)return false;
  if(f.trail&&pr.trail!=='weekly')return false;
  if(f.kids&&pr.kids!=='yes')return false;
  if(f.bike&&!(c&&c.how==='bike'))return false;
  if(f.weekend&&!(c&&(c.when||[]).includes('wkndam')))return false;
  if(f.fn&&!f.fn(p,b))return false;
  return true;
}
function stats(b,f){
  const people=dataset().filter(p=>((p.discovery||{})[b.id]||(p.concepts||{})[b.id])&&matches(p,b,f));
  const disc=people.map(p=>(p.discovery||{})[b.id]).filter(Boolean);
  const con=people.map(p=>(p.concepts||{})[b.id]).filter(Boolean);
  const count=(arr,key,multi)=>{const m={};for(const x of arr){const v=x[key];if(multi)(v||[]).forEach(k=>m[k]=(m[k]||0)+1);else if(v)m[v]=(m[v]||0)+1}return m};
  const picks={};for(const d of disc){(d.picks||[]).forEach(k=>picks[k]=(picks[k]||0)+1)}
  const writeins=disc.map(d=>d.writein).filter(Boolean);
  const avg=k=>{const v=con.map(c=>+c[k]).filter(Boolean);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null};
  const freq=count(con,'freq');
  const nf=con.filter(c=>c.freq).length;
  const weeklyPlus=nf?((freq.daily||0)+(freq.weekly||0))/nf:null;
  const sp=con.map(c=>SPEND_MID[c.spend]).filter(Boolean);
  const comments=people.filter(p=>(p.concepts||{})[b.id]&&p.concepts[b.id].comment).map(p=>({text:p.concepts[b.id].comment,p:p.profile||{},c:p.concepts[b.id],dist:effDist(p,b),at:p.concepts[b.id].at||p.updatedAt||0})).sort((x,y)=>y.at-x.at);
  return {n:people.length,nd:disc.length,nc:con.length,picks,writeins,concept:avg('concept'),location:avg('location'),weeklyPlus,
    ticket:sp.length?sp.reduce((a,b)=>a+b,0)/sp.length:null,freq,when:count(con,'when',true),how:count(con,'how'),spend:count(con,'spend'),extras:count(con,'extras',true),comments};
}

function groupRows(rows){

    p.updatedAt=Math.max(p.updatedAt,at);
  }
  return Object.values(m);
}
function connect(){
  const timer=setTimeout(()=>{if(S.store==='connecting'){S.store='local';setStatus();render()}},12000);
  const done=rows=>{clearTimeout(timer);S.live=groupRows(rows);S.store='live';S.liveReady=true;setStatus();const r=route();if(r.view!=='survey'||!S.touched)render()};
  const fail=()=>{clearTimeout(timer);S.store='local';setStatus();render()};
  gs('all').then(res=>{
    if(res&&typeof res==='object'&&res.version){
      S.backendVersion=res.version;
      if(res.config&&typeof applyConfig==='function')applyConfig(res.config);
      done(res.answers);
    } else {
      // Older backend: it only knows how to return answers.
      S.backendVersion=1;
      gs('getAnswers').then(done).catch(fail);
    }
  }).catch(fail);
}
function rowFor(b){
  const p=S.mine.profile||{}, d=S.mine.discovery[b.id]||{}, c=S.mine.concepts[b.id]||{};
  const lab=(map,v)=>v?(map[v]||v):'';
  const labs=(map,arr)=>(arr||[]).map(v=>map[v]||v).join(', ');
  return {
    building:b.id, address:b.name,
    picks:labs(LBL.cats,d.picks), writein:d.writein||'',
    concept:c.concept||'', location:c.location||'',
    freq:lab(LBL.freq,c.freq), when:labs(LBL.when,c.when), how:lab(LBL.how,c.how), spend:lab(LBL.spend,c.spend),
    extras:labs(LBL.extras,c.extras), comment:c.comment||'',
    town:lab(LBL.towns,p.town), band:DIST_LABEL[c.dist]||'', modes:labs(toMap(MODES),p.modes), trail:lab(toMap(TRAIL),p.trail), kids:lab(toMap(KIDS),p.kids)
  };
}
let saving=Promise.resolve();
function save(quiet,b){
  saveLocal();
  if(!b)return Promise.resolve(false);
  const payload={rid:getRid(),row:rowFor(b),data:JSON.stringify({building:b.id,profile:S.mine.profile,discovery:S.mine.discovery[b.id]||null,concept:S.mine.concepts[b.id]||null,heard:S.mine.heard||null,src:ARRIVED_SRC,at:S.mine.updatedAt}),...(S.meta||{})};
  saving=saving.then(()=>gs('submitAnswer',payload)).then(rows=>{
    if(Array.isArray(rows)){S.live=groupRows(rows);S.store='live'}
    setStatus(); return true;
  }).catch(e=>{
    S.store='local';setStatus();
    if(!quiet)toast(STAGE==='staging'&&!(S.backendVersion>=3)?'Saving is turned off in the test copy until the backend is updated.':'Could not reach the server. Your answers are saved on this device; try again later.');
    return false});
  return saving;
}

// ---------- routing ----------
function route(){
  const h=(location.hash||'').replace('#','');
  for(const b of BUILDINGS){ if(h===b.slug)return {view:'survey',b}; if(h===b.slug+'-results')return {view:'results',b}; }
  for(const A of AREAS){ if(h==='area-'+A.slug)return {view:'area',area:A}; }
  for(const b of BUILDINGS){ if(h==='flyer-'+b.slug)return {view:'flyer',b}; if(h==='report-'+b.slug)return {view:'report',b}; }
  for(const A of AREAS){ if(h==='report-area-'+A.slug)return {view:'areareport',area:A}; }
  if(h==='about')return {view:'about'};
  if(h==='join')return {view:'join'};
  if(h==='developers')return {view:'developers'};
  if(h==='privacy')return {view:'privacy'};
  if(h==='release-notes')return {view:'releases'};
  return {view:'home'};
}

function bars(map,opts,total,{sort=false,limit=0}={}){

function initMap(r){

  GEO.trail.forEach(seg=>L.polyline(seg,{color:sun,weight:4,opacity:.9}).bindTooltip('Poudre River Trail',{sticky:true}).addTo(MAP));

    }

  }
  setTimeout(()=>MAP&&MAP.invalidateSize(),200);
}

function viewResults(b){
  const f=S.filters, st=stats(b,f);
  const whoChips=`<div class="chips">${WHO.map(([v,l])=>`<button type="button" class="chip" data-act="who" data-v="${v}" aria-pressed="${f.who===v}">${esc(l)}</button>`).join('')}</div>`;
  const tog=(k,l)=>`<button type="button" class="chip" data-act="flag" data-v="${k}" aria-pressed="${!!f[k]}">${esc(l)}</button>`;
  const flagChips=`<div class="chips">${tog('trail','Trail weekly+')}${tog('bike','Would bike there')}${tog('weekend','Weekend mornings')}${tog('kids','Kids at home')}</div>`;
  let body;
  if(!st.n){
    body=`<div class="panel empty">No one matches these filters yet.${activeMode()==='live'?' Share the survey link to get answers, or switch to the simulated demo.':''}</div>`;
  } else {
    const tp=topOf(st.picks), tx=topOf(st.extras);
    const headline=(st.nc&&st.weeklyPlus!=null)?`${Math.round(st.weeklyPlus*100)}% would visit ${esc(b.concept.label)} weekly or more${tx?`, and “${esc(LBL.extras[tx[0]])}” is the top ask`:''}.`:(tp?`Top wish: ${esc(LBL.cats[tp[0]])}.`:`${st.n} ${st.n===1?'person has':'people have'} weighed in.`);
    const quotes=st.comments.slice(0,6).map(q=>{
      const tags=[LBL.towns[q.p.town]||'',q.dist?DIST_LABEL[q.dist]+' away':'',q.p.trail==='weekly'?'trail weekly':'',`rated ${q.c.concept}/5`].filter(Boolean).join(' · ');
      return `<div class="quote"><span>“${esc(q.text)}”</span><small>${esc(tags)}</small></div>`}).join('');
    body=`
    ${st.n<10?`<div class="warnbox"><b>Only ${st.n} ${st.n===1?'person matches':'people match'}.</b> Treat this as a hint, not a result. The public version hides groups under 10.</div>`:''}
    <p class="headline">${headline}</p>
    <div class="kpis">
      <div class="kpi"><b>${st.n}</b><span>people match</span></div>
      <div class="kpi"><b>${st.concept!=null?st.concept.toFixed(1):'–'}</b><span>idea score (of 5)</span></div>
      <div class="kpi"><b>${st.location!=null?st.location.toFixed(1):'–'}</b><span>location score (of 5)</span></div>
      <div class="kpi"><b>${st.ticket!=null?'$'+st.ticket.toFixed(0):'–'}</b><span>typical spend per visit</span></div>
    </div>
    <div class="panel"><h3>What people want here</h3><p class="small muted">${st.nd} answered · up to 3 picks each</p>${bars(st.picks,CATS,st.nd,{sort:true,limit:8})}
      ${st.writeins.length?`<p class="small"><b>Write-ins:</b> ${st.writeins.slice(0,8).map(esc).join(', ')}</p>`:''}</div>
    <div class="panel"><h3>The idea: ${esc(b.concept.title)}</h3><p class="small muted">${st.nc} rated it</p>
      <div class="grid2">
        <div><p class="label" style="margin-bottom:8px">How often</p>${bars(st.freq,FREQ,st.nc)}</div>
        <div><p class="label" style="margin-bottom:8px">When</p>${bars(st.when,WHEN,st.nc)}</div>
        <div><p class="label" style="margin-bottom:8px">Getting there</p>${bars(st.how,HOW,st.nc)}</div>
        <div><p class="label" style="margin-bottom:8px">Spend per visit</p>${bars(st.spend,SPEND,st.nc)}</div>
      </div>
      <div><p class="label" style="margin-bottom:8px">Must-haves</p>${bars(st.extras,EXTRAS,st.nc,{sort:true,limit:5})}</div>
    </div>
    <div class="panel"><h3>What people said</h3><p class="small muted">Comments appear after a quick review, without names.</p>${quotes||'<p class="muted small">No reviewed comments from this group yet.</p>'}</div>`;
  }
  const A=AREA[b.area];
  return `<a class="back" href="#area-${A.slug}">← ${esc(A.name)}</a>
  <section class="bhead"><span class="label">Public results · ${esc(A.name)}</span><h1 class="lettered"><span class="pin pin-sm" aria-hidden="true"><b>${esc(b.letter)}</b></span><span>${esc(b.name)}</span></h1></section>
  <div style="display:grid;gap:14px">
    <div class="row" style="align-items:center;justify-content:space-between">${modeSwitch()}<span class="row"><a class="btn ghost" href="#${b.slug}" style="padding:9px 12px">Add my answers</a><button type="button" class="btn ghost" data-act="share" data-v="${b.id}" style="padding:9px 12px">Share</button><a class="btn ghost" href="#report-${b.slug}" style="padding:9px 12px">Sponsor report</a></span></div>
    ${demoBanner()}
    <div class="filters">
      <span class="label">Quick views</span>
      <div class="presets"><button type="button" class="preset" data-act="preset" data-v="walk">Neighbors within walking distance</button><button type="button" class="preset" data-act="preset" data-v="trail">Windsor trail riders on weekend mornings</button><button type="button" class="preset" data-act="preset" data-v="all">Everyone</button></div>
      <span class="label">Who</span>${whoChips}
      <span class="label">Narrow down</span>${flagChips}
    </div>
    ${body}
    <div class="cta-card"><div><h3>Thanks for weighing in.</h3><p class="small muted">Want a say in the next project near you? We will send you a 2-minute survey.</p></div><a class="btn primary" href="#join">Get notified</a></div>
    <div class="panel" id="feedback-panel">
      <h3>What do you think of this idea?</h3>
      <p class="small muted">We are testing whether neighbors would use something like this. Was it easy? What was confusing? What would make you come back? Anonymous. <a href="#privacy">Privacy policy</a></p>
      <textarea id="fb" maxlength="1500" placeholder="Honest thoughts welcome…"></textarea>
      <div class="hp" aria-hidden="true"><label for="hp-fb">Leave this field empty</label><input type="text" id="hp-fb" name="hp-fb" tabindex="-1" autocomplete="off"></div>
      <div class="row"><button type="button" class="btn primary" data-act="feedback">Send feedback</button></div>
    </div>
  </div>`;
}

function viewPrivacy(){

function viewAreaReport(A){
  const sites=sitesIn(A);

  const best=rows.filter(r=>r.st.nc>=3).sort((x,y)=>(y.st.concept||0)-(x.st.concept||0))[0];
  return reportHead('Area',A.name,`${A.town} · ${sites.length} site${sites.length===1?'':'s'} · ${A.blurb}`)+`
  <section class="rep-sec"><h2>Sites compared</h2>
    ${best?`<p class="headline">Strongest idea so far: ${esc(best.b.concept.title)} at ${esc(best.b.name.split(' · ')[0])}, ${fmtN(best.st.concept)} out of 5 from ${best.st.nc} people.</p>`:''}
    <div class="tbl"><table><thead><tr><th scope="col">Site</th><th scope="col">Suggested idea</th><th scope="col">People</th><th scope="col">Idea (1–5)</th><th scope="col">Location (1–5)</th><th scope="col">Weekly or more</th><th scope="col">Top wish</th><th scope="col">Top must-have</th></tr></thead>
    <tbody>${rows.map(({b,st,tp,tx})=>`<tr${st.n>0&&st.n<10?' class="small-n"':''}><th scope="row">${esc(b.letter)} · ${esc(b.name.split(' · ')[0])}${st.n>0&&st.n<10?' *':''}</th><td>${esc(b.concept.title)}</td><td class="num">${st.n}</td><td class="num">${fmtN(st.concept)}</td><td class="num">${fmtN(st.location)}</td><td class="num">${fmtP(st.weeklyPlus)}</td><td>${tp?esc(LBL.cats[tp[0]]):'–'}</td><td>${tx?esc(LBL.extras[tx[0]]):'–'}</td></tr>`).join('')}</tbody></table></div>
    <p class="small no-print">Full detail for each site: ${sites.map(b=>`<a href="#report-${b.slug}">${esc(b.letter)} · ${esc(b.name.split(' · ')[0])}</a>`).join(' · ')}</p>
  </section>
  ${reportMethods()}`;
}

document.addEventListener('click',e=>{
  const chip=e.target.closest('[data-chip]');
  if(chip&&chip.closest('#survey')){
    const g=chip.closest('.chips'), name=g.dataset.name, multi=g.dataset.multi==='1', max=+g.dataset.max||0, v=chip.dataset.chip;
    S.touched=true;
    if(multi){
      const arr=S.draft[name]||(S.draft[name]=[]); const i=arr.indexOf(v);
      if(i>=0)arr.splice(i,1); else { if(max&&arr.length>=max){toast(`Pick up to ${max}. Tap one to remove it first.`);return} arr.push(v) }
      chip.setAttribute('aria-pressed',arr.includes(v));
    } else {
      S.draft[name]=S.draft[name]===v?undefined:v;
      g.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.chip===S.draft[name]));
      if(name==='town'){const w=$('#dist-wrap');if(w)w.hidden=S.draft.town!=='timnath'}
    }
    return;
  }
  const act=e.target.closest('[data-act]'); if(!act)return;
  const a=act.dataset.act, v=act.dataset.v;
  if(a==='mode'){S.mode=v;render()}
  else if(a==='who'){S.filters.who=v;render()}
  else if(a==='flag'){S.filters[v]=!S.filters[v];render()}
  else if(a==='preset'){
    S.filters=v==='walk'?{who:'walk',trail:false,bike:false,weekend:false,kids:false}
      :v==='trail'?{who:'windsor',trail:true,bike:true,weekend:true,kids:false}
      :{who:'all',trail:false,bike:false,weekend:false,kids:false};
    render();
  }
  else if(a==='locate'){locate(v)}
  else if(a==='share'){openShare('site',v)}
  else if(a==='share-area'){openShare('area',v)}
  else if(a==='close-share'){closeShare()}
  else if(a==='print'){window.print()}
  else if(a==='copy-link'){
    const inp=document.getElementById('share-link'); const val=inp?inp.value:'';
    const ok=()=>{act.textContent='Copied';toast('Link copied.')};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(val).then(ok).catch(()=>{inp.select();toast('Press Ctrl+C to copy.')});
    else {inp.select();toast('Press Ctrl+C to copy.')}
  }
  else if(a==='native-share'){const d=document.getElementById('share-dlg');navigator.share({title:'Plotline: '+d.dataset.title,text:'What should go here? Weigh in (about 2 minutes, no name needed).',url:d.dataset.link}).catch(()=>{})}
  else if(a==='to-request'){const c=document.getElementById('request');if(c)c.scrollIntoView({behavior:'smooth',block:'start'})}
  else if(a==='od-request'){
    const val=id=>((document.getElementById(id)||{}).value||'').trim();
    const err=$('#r-error');
    if(!val('r-contact')||!val('r-prop')){err.textContent='Please add a way to reach you and the project address.';err.hidden=false;return}
    err.hidden=true; act.disabled=true; act.textContent='Sending\u2026';
    const text='[On-demand request] Name: '+val('r-name')+' | Contact: '+val('r-contact')+' | Project: '+val('r-prop')+' | Reach: '+val('r-reach')+' | Timeline: '+val('r-when')+' | Details: '+val('r-msg');
    gs('submitFeedback',{rid:'',text:text.slice(0,1500),hp:hpVal('hp-request')}).then(()=>{act.textContent='Sent';toast('Thanks! We will get back to you with a plan.');['r-name','r-contact','r-prop','r-msg'].forEach(i=>{const e=document.getElementById(i);if(e)e.value=''})})
      .catch(()=>{act.disabled=false;act.textContent='Send request';toast('Could not send. Please try again.')});
  }
  else if(a==='join'){
    const val=id=>((document.getElementById(id)||{}).value||'').trim();
    const email=val('j-email'), phone=val('j-phone').replace(/[^\d+]/g,''), sms=!!(document.getElementById('j-sms')||{}).checked;
    const town=val('j-town'), zip=val('j-zip'), near=val('j-near');
    const err=$('#j-error'); const fail=m=>{err.textContent=m;err.hidden=false};
    if(!email&&!phone)return fail('Add an email, a mobile number, or both.');
    if(email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return fail('That email address does not look right.');
    if(phone&&phone.replace(/\D/g,'').length<10)return fail('Please enter a 10-digit mobile number.');
    if(phone&&!sms)return fail('To get texts, check the box agreeing to receive them. Or remove the number to use email only.');
    if(!town)return fail('Please choose where you live.');
    if(zip&&!/^\d{5}$/.test(zip))return fail('ZIP code should be 5 digits.');
    err.hidden=true; act.disabled=true; act.textContent='Signing you up\u2026';
    const payload={email,phone,sms,town:LBL.towns[town]||town,zip,near,source:'join page',hp:hpVal('hp-join')};
    const done=()=>{const f=document.getElementById('join-form');if(f)f.innerHTML='<div class="qhead"><h2>You\u2019re on the list.</h2><p class="muted">We will reach out when there is a new project near you. Thanks for speaking up for your neighborhood.</p></div><div class="row"><a class="btn primary" href="#home">Weigh in on a building now</a></div>';toast('You are on the list.')};
    gs('joinPanel',payload).then(done).catch(()=>{
      const text='[Panel signup] Email: '+email+' | Mobile: '+phone+' | Text consent: '+(sms?'yes':'no')+' | Town: '+payload.town+' | ZIP: '+zip+' | Near: '+near;
      gs('submitFeedback',{rid:'',text,hp:payload.hp}).then(done).catch(()=>{act.disabled=false;act.textContent='Notify me';toast('Could not sign you up. Please try again.')});
    });
  }
  else if(a==='edit-profile'){S.editProfile=true;S.touched=true;render()}
  else if(a==='feedback'){
    const ta=$('#fb'); const text=(ta&&ta.value||'').trim();
    if(!text){toast('Type a few words first.');return}
    act.disabled=true; act.textContent='Sending…';

      .catch(()=>{act.disabled=false;act.textContent='Send feedback';toast('Could not send. Please try again.')});
  }
});

  if(!d.picks.length&&!d.writein.trim())missing.push('what you would want here');
  if(!d.dist)missing.push('how far you live from here');
  if(!d.concept)missing.push('how you feel about the idea');
  if(!d.location)missing.push('how you feel about the spot');
  if(needProfile){ if(!d.town)missing.push('where you live'); if(!d.trail)missing.push('how often you use the trail'); }
  const err=$('#form-error');
  if(missing.length){err.textContent='Almost there. Please answer: '+missing.join(', ')+'.';err.hidden=false;err.scrollIntoView({block:'center',behavior:'smooth'});return}
  const now=Date.now();
  S.meta={hp:hpVal('hp-survey'),elapsed:now-(S.formStart||now),update:!!(S.mine.discovery[b.id]||S.mine.concepts[b.id])};
  S.mine.discovery[b.id]={picks:d.picks.slice(),writein:d.writein.trim(),at:now};
  S.mine.concepts[b.id]={concept:+d.concept,location:+d.location,dist:d.dist,how:d.how||null,when:d.when.slice(),freq:d.freq||null,spend:d.spend||null,extras:d.extras.slice(),comment:d.comment.trim(),at:now};
  if(needProfile){S.mine.profile={town:d.town,modes:d.modes.slice(),trail:d.trail,kids:d.kids||null}}
  if(d.heard&&!S.mine.heard)S.mine.heard=d.heard;
  S.mine.updatedAt=now;
  const btn=e.target.querySelector('button[type=submit]'); if(btn){btn.disabled=true;btn.textContent='Saving…'}
  const shared=await save(false,b);
  S.meta=null;
  S.mode='live'; S.touched=false; S.filters={who:'all',trail:false,bike:false,weekend:false,kids:false};
  const hadComment=!!d.comment.trim();
  toast(shared?(hadComment?'Thanks! Your answers are in. Your comment will appear after a quick review.':'Thanks! Your answers are in. Here are the results.'):'Thanks! Saved on this device. Here are the results.');
  location.hash=b.slug+'-results';
});

lastRoute=location.hash;
if(STAGE==='staging'){const sb=document.getElementById('stage-banner');sb.hidden=false;sb.innerHTML='<b>Test copy.</b> This is where new changes are checked before they go live. Answers here are saved to separate test tabs and never appear on the live site. <a href="../">Go to the live site</a>';document.title='[TEST] '+document.title;}
{const fv=document.getElementById('foot-ver');if(fv)fv.textContent='Version '+VERSION+' (alpha)';}
render();
setTimeout(connect,0);
})();
</script>
